# Development compose — fast iteration without full image rebuilds.
# Requires Docker Compose v2.22+ (watch is built in).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Frontend changes (any file under frontend/):
#   → auto-runs "npm run build" inside the container, no full rebuild
# Go source changes:
#   → auto-runs "go build" inside the container, restarts x-ui
# Translation changes:
#   → triggers frontend rebuild

services:
  3xui:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: 3xui_dev
    volumes:
      - ./db/:/etc/x-ui/
      - ./cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    ports:
      - "2053:2053"
      - "2096:2096"
    restart: unless-stopped
    develop:
      watch:
        # Go source changes → rebuild + restart
        - path: .
          target: /app
          action: rebuild
          ignore:
            - frontend/
            - web/dist/
            - db/
            - cert/
            - .git/
            - .kilo/
            - .claude/
        # Frontend changes → rebuild (npm run build in Docker frontend stage)
        - path: frontend/
          target: /src/frontend
          action: rebuild
        # Translation changes → rebuild frontend
        - path: web/translation/
          target: /src/web/translation
          action: rebuild
